[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "branddeck-ai"
version = "0.1.0"
description = "Template-adaptive AI pipeline for generating branded PowerPoint decks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Тимур Хурматуллин", email = "t.khurmatullin@mail.ru" }]
dependencies = [
  "python-pptx>=1.0.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "python-multipart>=0.0.9", "uvicorn>=0.30"]
documents = ["markitdown[all]>=0.1.0"]
pdf-reference = ["PyMuPDF>=1.24"]
export = ["PyMuPDF>=1.24"]
dev = ["pytest>=8.0", "ruff>=0.9", "fastapi>=0.115", "python-multipart>=0.0.9", "httpx>=0.28", "PyMuPDF>=1.24"]

[project.scripts]
branddeck = "slide_agent.cli:main"

[tool.setuptools.packages.find]
include = ["slide_agent*", "backend*", "frontend*"]
namespaces = false

[tool.setuptools.package-data]
slide_agent = ["prompts/*.txt"]
frontend = ["dist/*.html", "dist/assets/*", "dist/assets/fonts/*", "dist/assets/images/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
